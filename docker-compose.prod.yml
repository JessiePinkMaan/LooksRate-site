x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loxrate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-loxrate}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-loxrate} -d ${POSTGRES_DB:-loxrate}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  minio:
    image: minio/minio:latest
    profiles: ["storage"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
    volumes:
      - miniodata:/data
    healthcheck:
      test:
        ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  # Идемпотентно создаёт бакеты. Сейчас видео хранится локально, но
  # S3-совместимое хранилище готово для следующего этапа.
  minio-init:
    image: minio/mc:latest
    profiles: ["storage"]
    restart: "no"
    env_file: .env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$S3_ACCESS_KEY_ID\" \"$$S3_SECRET_ACCESS_KEY\";
      mc mb --ignore-existing local/\"$$S3_BUCKET_VIDEO\";
      mc mb --ignore-existing local/\"$$S3_BUCKET_ASSETS\";
      exit 0;
      "
    logging: *default-logging

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        SITE_URL: ${SITE_URL:?set SITE_URL in .env}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      STORAGE_DIR: /app/storage/videos
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    volumes:
      # Local video fallback must survive container re-creation.
      - videostorage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  # Опциональный TLS-прокси. Включается профилем proxy:
  # docker compose -f docker-compose.prod.yml --profile proxy up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web
    logging: *default-logging

  # Одноразовые утилиты: миграции и сид (профиль tools).
  migrate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: builder
    env_file: .env
    command: ["pnpm", "--filter", "@loxrate/db", "exec", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  seed:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: builder
    env_file: .env
    command: ["pnpm", "--filter", "@loxrate/db", "seed"]
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  # Выдаёт OWNER зарегистрированному пользователю:
  # docker compose ... --profile tools run --rm promote <username>
  promote:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: builder
    env_file: .env
    command: ["pnpm", "--filter", "@loxrate/db", "promote"]
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  # Worker намеренно не включён в прод-стек: текущий src/index.ts —
  # заглушка, которая сразу завершается. Вернуть сервис после реального
  # транскодинга (Фаза 8), иначе Docker будет перезапускать его по кругу.

volumes:
  pgdata:
  redisdata:
  miniodata:
  videostorage:
  caddydata:
  caddyconfig:
