services:
  postgres:
    image: postgres:16-alpine
    container_name: loxrate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: loxrate
      POSTGRES_PASSWORD: loxrate
      POSTGRES_DB: loxrate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loxrate -d loxrate"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: loxrate-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: loxrate-minio
    profiles: ["storage"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: loxrate
      MINIO_ROOT_PASSWORD: loxrate-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Создаёт бакеты при первом запуске (идемпотентно).
  minio-init:
    image: minio/mc:latest
    container_name: loxrate-minio-init
    profiles: ["storage"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 loxrate loxrate-secret;
      mc mb --ignore-existing local/loxrate-video;
      mc mb --ignore-existing local/loxrate-assets;
      exit 0;
      "

volumes:
  pgdata:
  redisdata:
  miniodata:
